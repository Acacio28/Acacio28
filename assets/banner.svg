<svg width="1500" height="500" viewBox="0 0 1500 500" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <!-- Background gradient: dark navy to black -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#000814"/>
      <stop offset="45%" stop-color="#001d3d"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>

    <!-- Glow radial behind the avatar -->
    <radialGradient id="glow" cx="50%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#00f5ff" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#00f5ff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#00f5ff" stop-opacity="0"/>
    </radialGradient>

    <!-- Text gradient for main heading -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#00f5ff"/>
    </linearGradient>

    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1500" height="500" fill="url(#bgGrad)"/>
  <rect width="1500" height="500" fill="url(#glow)"/>

  <!-- Subtle grid / circuit-style corner lines -->
  <g stroke="#00f5ff" stroke-opacity="0.25" stroke-width="2">
    <path d="M40 440 L100 440 L100 400 L160 400 L160 360" fill="none"/>
    <path d="M40 460 L120 460 L120 410 L180 410" fill="none"/>
    <path d="M1460 440 L1400 440 L1400 400 L1340 400 L1340 360" fill="none"/>
    <path d="M1460 460 L1380 460 L1380 410 L1320 410" fill="none"/>
  </g>

  <!-- Top left: website / handle -->
  <g transform="translate(60,70)">
    <circle cx="16" cy="16" r="16" fill="#00131a" stroke="#00f5ff" stroke-width="2"/>
    <path d="M16 4 A12 12 0 0 1 16 28 A12 12 0 0 1 16 4 M4 16 H28 M16 4 C22 10 22 22 16 28 C10 22 10 10 16 4"
          fill="none" stroke="#00f5ff" stroke-width="1.3"/>
    <text x="44" y="22" font-family="Fira Code, monospace" font-size="20" fill="#e6faff">github.com/Acacio28</text>
  </g>

  <!-- Top right: email -->
  <g transform="translate(1440,70)" text-anchor="end">
    <text x="-44" y="22" font-family="Fira Code, monospace" font-size="20" fill="#e6faff">acacioelezito933@gmail.com</text>
    <g transform="translate(-16,0)">
      <circle cx="16" cy="16" r="16" fill="#00131a" stroke="#00f5ff" stroke-width="2"/>
      <path d="M7 11 h18 v11 h-18 z M7 11 l9 7 l9 -7" fill="none" stroke="#00f5ff" stroke-width="1.3"/>
    </g>
  </g>

  <!-- Center avatar circle (GitHub cat placeholder) -->
  <g transform="translate(750,150)">
    <circle r="70" fill="#000814" stroke="#00f5ff" stroke-width="3" filter="url(#softGlow)"/>
    <g transform="translate(-42,-42) scale(0.33)" fill="#e6faff">
      <path d="M128 0C57.3 0 0 57.3 0 128c0 56.6 36.7 104.5 87.6 121.4 6.4 1.2 8.8-2.8 8.8-6.2
      0-3-.1-13-.2-25.6-35.6 7.7-43.1-15.2-43.1-15.2-5.8-14.8-14.2-18.7-14.2-18.7-11.6-7.9.9-7.7.9-7.7
      12.8.9 19.6 13.2 19.6 13.2 11.4 19.6 30 13.9 37.3 10.6 1.2-8.3 4.5-13.9 8.1-17.1-28.4-3.2-58.3-14.2-58.3-63.3
      0-14 5-25.5 13.2-34.5-1.3-3.2-5.7-16.2 1.3-33.7 0 0 10.8-3.5 35.3 13.2 10.2-2.8 21.2-4.3 32.1-4.3
      10.9 0 21.9 1.5 32.1 4.3 24.5-16.6 35.3-13.2 35.3-13.2 7 17.5 2.6 30.5 1.3 33.7 8.2 9 13.1 20.5 13.1 34.5
      0 49.3-30 60.1-58.5 63.2 4.6 4 8.7 11.8 8.7 23.8 0 17.2-.2 31-.2 35.2 0 3.4 2.4 7.5 8.8 6.2C219.3 232.4 256 184.6 256 128 256 57.3 198.7 0 128 0z"/>
    </g>
  </g>

  <!-- Main heading -->
  <text x="750" y="305" text-anchor="middle" font-family="Fira Code, monospace" font-size="64" font-weight="700"
        fill="url(#textGrad)" letter-spacing="4">HELLO WORLD</text>

  <!-- Subtitle -->
  <text x="750" y="345" text-anchor="middle" font-family="Fira Code, monospace" font-size="24"
        fill="#00f5ff" letter-spacing="2">Hi, I'm Acacio Elezito — Open Source Lover</text>

  <!-- Motto -->
  <text x="750" y="380" text-anchor="middle" font-family="Fira Code, monospace" font-size="18"
        fill="#7fd8de" letter-spacing="1" font-style="italic">Silent Coder. Loud Results.</text>

  <!-- OS badges: Debian + Linux -->
  <g transform="translate(750,420)">
    <!-- Debian badge -->
    <g transform="translate(-110,0)">
      <rect x="-98" y="-20" width="180" height="40" rx="20" fill="#0d0d0d" stroke="#00f5ff" stroke-opacity="0.5" stroke-width="1.5"/>
      <g transform="translate(-78,-16) translate(16,16) scale(1.4)">
        <!-- Debian swirl (mathematical spiral, official-style red) -->
        <path d="M 0.00 0.00 L 0.10 0.01 L 0.20 0.05 L 0.29 0.11 L 0.36 0.19 L 0.42 0.29 L 0.46 0.40 L 0.48 0.53 L 0.47 0.66 L 0.43 0.80 L 0.37 0.94 L 0.28 1.08 L 0.17 1.21 L 0.02 1.32 L -0.14 1.41 L -0.33 1.49 L -0.54 1.53 L -0.76 1.55 L -1.00 1.53 L -1.24 1.48 L -1.48 1.39 L -1.72 1.26 L -1.94 1.10 L -2.15 0.90 L -2.34 0.66 L -2.51 0.40 L -2.64 0.10 L -2.73 -0.22 L -2.78 -0.57 L -2.79 -0.93 L -2.75 -1.30 L -2.67 -1.67 L -2.53 -2.04 L -2.34 -2.40 L -2.10 -2.74 L -1.81 -3.06 L -1.47 -3.34 L -1.09 -3.59 L -0.67 -3.80 L -0.22 -3.95 L 0.25 -4.05 L 0.75 -4.09 L 1.27 -4.07 L 1.78 -3.98 L 2.30 -3.83 L 2.80 -3.61 L 3.28 -3.32 L 3.73 -2.97 L 4.14 -2.56 L 4.51 -2.09 L 4.83 -1.57 L 5.08 -1.00 L 5.26 -0.40 L 5.37 0.24 L 5.41 0.89 L 5.36 1.56 L 5.23 2.22 L 5.02 2.88 L 4.72 3.52 L 4.34 4.13 L 3.88 4.69 L 3.35 5.21 L 2.75 5.66 L 2.09 6.04 L 1.38 6.35 L 0.62 6.57 L -0.17 6.70 L -0.98 6.73 L -1.80 6.66 L -2.62 6.49 L -3.42 6.22 L -4.20 5.86"
              fill="none" stroke="#d70a53" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="-4.2" cy="5.86" r="1.15" fill="#e6faff"/>
      </g>
      <text x="-38" y="6" font-family="Fira Code, monospace" font-size="17" fill="#7fd8de" letter-spacing="1">Debian</text>
    </g>

    <!-- Linux badge -->
    <g transform="translate(102,0)">
      <rect x="-82" y="-20" width="164" height="40" rx="20" fill="#0d0d0d" stroke="#00f5ff" stroke-opacity="0.5" stroke-width="1.5"/>
      <g transform="translate(-64,-17)">
        <!-- back/body (black) -->
        <path d="M16 1.5 C23.5 1.5 27.5 9 27.5 18 C27.5 25.5 25 32 22.5 36 C21 38.3 11 38.3 9.5 36 C7 32 4.5 25.5 4.5 18 C4.5 9 8.5 1.5 16 1.5 Z" fill="#1a1a1a"/>
        <!-- white belly / face patch -->
        <path d="M16 6.5 C20.5 6.5 23 12 22.6 18.5 C22.3 24 21.2 30.5 19 34.5 C18 36.3 14 36.3 13 34.5 C10.8 30.5 9.7 24 9.4 18.5 C9 12 11.5 6.5 16 6.5 Z" fill="#ffffff"/>
        <!-- eyes -->
        <ellipse cx="12.4" cy="10.5" rx="2.3" ry="2.7" fill="#ffffff"/>
        <ellipse cx="19.6" cy="10.5" rx="2.3" ry="2.7" fill="#ffffff"/>
        <circle cx="12.9" cy="11.1" r="1.25" fill="#0d0d0d"/>
        <circle cx="20.1" cy="11.1" r="1.25" fill="#0d0d0d"/>
        <circle cx="13.3" cy="10.6" r="0.35" fill="#ffffff"/>
        <circle cx="20.5" cy="10.6" r="0.35" fill="#ffffff"/>
        <!-- beak -->
        <path d="M13.3 14 L18.7 14 L16 18.3 Z" fill="#f6a400"/>
        <!-- flippers -->
        <path d="M4.5 16 C1.5 18.5 0.8 24.5 3 29" fill="none" stroke="#1a1a1a" stroke-width="3.2" stroke-linecap="round"/>
        <path d="M27.5 16 C30.5 18.5 31.2 24.5 29 29" fill="none" stroke="#1a1a1a" stroke-width="3.2" stroke-linecap="round"/>
        <!-- feet -->
        <path d="M10 35.5 L14.5 35.5 L13 39.5 L9 39.5 Z" fill="#f6a400"/>
        <path d="M17.5 35.5 L22 35.5 L23 39.5 L18.5 39.5 Z" fill="#f6a400"/>
      </g>
      <text x="-22" y="6" font-family="Fira Code, monospace" font-size="17" fill="#7fd8de" letter-spacing="1">Linux</text>
    </g>
  </g>

  <!-- Bottom decorative slashes left -->
  <g transform="translate(60,430)" stroke="#00f5ff" stroke-opacity="0.55" stroke-width="2" fill="none">
    <path d="M0 60 L40 0 M40 60 L80 0 M80 60 L120 0 M120 60 L160 0"/>
  </g>

  <!-- Bottom decorative slashes right -->
  <g transform="translate(1240,430)" stroke="#00f5ff" stroke-opacity="0.55" stroke-width="2" fill="none">
    <path d="M0 60 L40 0 M40 60 L80 0 M80 60 L120 0 M120 60 L160 0"/>
  </g>
</svg>
